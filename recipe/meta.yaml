{% set name = "pyrfr" %}
{% set version = "0.9.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: bc6e758317cf79579fe6b7ce5f01dd42f77c991bf707e33646e8c6a9112c186b

build:
  number: 5
  script:
    # Drop the vendored cereal 1.2.2 tree and build against conda-forge's cereal
    # instead. ./include is first on the include path, so the vendored copy would
    # otherwise shadow $PREFIX/include/cereal.
    - rm -rf include/cereal                                    # [unix]
    - if exist include\cereal rmdir /s /q include\cereal       # [win]
    - {{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - {{ compiler('cxx') }}
    - {{ stdlib("c") }}
    - swig >3.0.3
  host:
    # cereal <1.3.0 ships a rapidjson copy whose GenericStringRef assigns to its
    # own const members; GCC 15 (-Wtemplate-body) and recent clang reject it.
    - cereal >=1.3.0
    - pip
    - python
    - setuptools
    - wheel
  run:
    - python

test:
  imports:
    - pyrfr
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://pypi.org/project/pyrfr/
  license: BSD-2-Clause AND BSD-3-Clause AND BSL-1.0 AND JSON AND MIT
  license_file:
    - LICENSE_cereal-1.2.2
    - LICENSE_doxy2swig
    - LICENSE.txt
    - LICENSE_rapidjson
    - LICENSE_rapidxml
  summary: A extensible C++ library for random forests with Python bindings.
  dev_url: https://github.com/automl/random_forest_run

extra:
  recipe-maintainers:
    - BastianZim
    - mfeurer
